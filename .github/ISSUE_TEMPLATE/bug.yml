name: Bug report
description: Report a reproducible defect
title: "Bug: "
labels:
  - type:bug
body:
  - type:textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type:textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type:textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device, commit, and any other relevant context.
    validations:
      required: true
  - type:textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs or screenshots with secrets and personal data removed.
