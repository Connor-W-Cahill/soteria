name: User story
description: Propose user-facing work with testable acceptance criteria
title: "US-XX "
labels:
  - type:story
body:
  - type:textarea
    id: story
    attributes:
      label: User story
      description: Describe the user, need, and benefit.
      placeholder: As a ... I want ... so that ...
    validations:
      required: true
  - type:textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type:textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues, or write none.
      placeholder: "Depends on: #123"
    validations:
      required: true
